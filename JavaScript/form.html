<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário JavaSript</title>
    <script src="./form.js" defer></script>
</head>
<body>
    <h1>Calculadora de média acadêmica</h1>

    <form action="" id="formularioAcademico">
        <h2>Formulário</h2>
        <div>
            <label for="nome">Digite seu nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required></input>
        </div>
        <div>
            <label for="notaUm">Digite seu nome</label>
            <input type="number" id="notaUm" name="notaUm" placeholder="Digite a primeira nota" required></input>
        </div>
        <div>
            <label for="notaDois">Digite seu nome</label>
            <input type="number" id="notaDois" name="notaDois" placeholder="Digite a segunda nota" required></input>
        </div>
        <div>
            <br>
            <button type="submit">Calcular média</button>
            <button type="reset">Limpar campos</button>
        </div>
    </form>
    
</body>
</html>
